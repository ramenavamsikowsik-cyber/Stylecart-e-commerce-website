<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VkFashions | Register</title>
</head>
<body style="background-image: url(./Images/clobg.jpg); height: 100vh; width: 100%; margin: 0; font-family: sans-serif;">
    <div style="height: 100px; width: 100%;"></div>

     <div style="height: 500px; width: 100%; display: flex; justify-content: center;">
        <div style="height: 500px; width: 60%; display: flex; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            
            <div style="height: 100%; width: 50%; background-image: url(./Images/fashlog.jpeg); background-repeat: no-repeat; background-size: cover; background-position: center;">
            </div>
            
            <div style="height: 100%; width: 50%; background-color: rgb(121, 14, 14); display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <h2 style="text-align: center; color: white; margin-bottom: 5px;">CREATE YOUR ACCOUNT</h2>
                <h4 style="text-align: center; color: white; margin-top: 0; margin-bottom: 20px;">Sign Up To View Fashion World!</h4>
                
                <form id="register-form" align="center" style="width: 100%;">
                    
                    <input type="text" id="reg-contact" placeholder="Mobile Number/Email" required style="height: 30px; width: 70%; margin-bottom: 10px; border-radius: 5px; border: none; padding-left: 10px;">
                    <input type="password" id="reg-password" placeholder="Password" required style="height: 30px; width: 70%; margin-bottom: 10px; border-radius: 5px; border: none; padding-left: 10px;">
                    <input type="text" id="reg-fullname" placeholder="Full Name" required style="height: 30px; width: 70%; margin-bottom: 10px; border-radius: 5px; border: none; padding-left: 10px;">
                    <input type="text" id="reg-username" placeholder="User Name" required style="height: 30px; width: 70%; margin-bottom: 20px; border-radius: 5px; border: none; padding-left: 10px;">
                    
                    <input type="submit" value="Sign Up" style="height: 40px; width: 70%; background-color: orange; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px;">
                    
                    <br>
                    <a href="login page.html" style="color: white; text-decoration: none; font-size: 14px;">Already have an account? Login here</a>
                </form>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Stop page from refreshing
            
            // Grab the new username
            const newUsername = document.getElementById('reg-username').value;
            
            // Show a success message
            alert('Account created successfully for ' + newUsername + '! Please log in with your new credentials.');
            
            // Redirect them to the login page so they can actually log in
            window.location.href = 'login page.html';
        });
    </script>
</body>
</html>
