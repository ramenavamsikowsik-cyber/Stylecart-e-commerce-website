<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VkFashions | Contact</title>
    <style>
        .nav-link-btn {
            font-size: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 30px;
            position:relative;
            z-index: 1;
            transition: all 0.3s ease-in-out;
        }

        .nav-link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-color: orangered;
            border-radius: 30px;
            z-index: -1; 
            transform: scaleX(0); 
            transform-origin: center;
            transition: transform 0.3s ease-in-out;
        }

        .nav-link-btn:hover {
            color: white;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5); 
        }

        .nav-link-btn:hover::before {
            transform: scaleX(1); 
        }

        .nav-link-btn.active {
            background-color: orangered;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5);
        }
    </style>
</head>
<body style="background-image: url(./Images/cream123.jpg); background-attachment: fixed; margin: 0; font-family: sans-serif;">
    
    <div style="height: 100px; width: 100%; background-color: rgb(121, 14, 14); position: fixed; top: 0; z-index: 1000; display: flex; align-items: center;">
        <div style="width: 20%; padding-left: 20px;">
            <h2 style="font-size: 32px; color: whitesmoke; font-style: italic; margin: 0;">StyleKart</h2>
        </div>
        <div style="width: 60%; display: flex; justify-content: center; gap: 20px;">
            <a href="homepage.html" class="nav-link-btn">Home</a>
            <a href="productspage.html" class="nav-link-btn">Products</a>
            <a href="about.html" class="nav-link-btn">About</a>
            <a href="contactpage.html" class="nav-link-btn">Contact</a>
        </div>
    </div>

    <div style="margin-top: 150px; display: flex; justify-content: center;">
        <div style="background-color: rgb(121, 14, 14); width: 40%; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;">
            <h2 style="color: white; margin-bottom: 20px;">Get in Touch</h2>
            
            <form id="contact-form" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                <input type="text" placeholder="Your Name" required style="width: 80%; padding: 10px; border-radius: 5px; border: none;">
                <input type="email" placeholder="Your Email" required style="width: 80%; padding: 10px; border-radius: 5px; border: none;">
                <textarea placeholder="Your Message..." required style="width: 80%; padding: 10px; border-radius: 5px; border: none; height: 100px; resize: none;"></textarea>
                
                <button type="submit" style="background-color: orangered; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 85%;">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload
            alert('Thank you for reaching out! Our team will get back to you shortly.');
            this.reset(); // Clear the form fields
        });
    </script>
</body>
</html>
