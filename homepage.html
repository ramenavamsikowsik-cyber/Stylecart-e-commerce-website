<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VkFashions | Welcome</title>
    <style>
        .nav-link-btn {
            font-size: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 30px;
            position:relative;
            z-index: 1;
            transition: all 0.3s ease-in-out;
        }

        .nav-link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-color: orangered;
            border-radius: 30px;
            z-index: -1; 
            transform: scaleX(0); 
            transform-origin: center;
            transition: transform 0.3s ease-in-out;
        }

        .nav-link-btn:hover {
            color: white;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5); 
        }

        .nav-link-btn:hover::before {
            transform: scaleX(1); 
        }

        .nav-link-btn.active {
            background-color: orangered;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5);
        }
    </style>
</head>
<body style="background-image: url(./Images/cream123.jpg); background-attachment: fixed; margin: 0; font-family: sans-serif;">
    
    <div style="height: 100px; width: 100%; background-color: rgb(121, 14, 14); position: fixed; top: 0; z-index: 1000; display: flex; align-items: center;">
        <div style="width: 20%; padding-left: 20px;">
            <h2 style="font-size: 32px; color: whitesmoke; font-style: italic; margin: 0;">StyleKart</h2>
        </div>
        <div style="width: 50%; display: flex; justify-content: center; gap: 20px;">
            <a href="homepage.html" class="nav-link-btn">Home</a>
            <a href="productspage.html" class="nav-link-btn">Products</a>
            <a href="about.html" class="nav-link-btn">About</a>
            <a href="contactpage.html" class="nav-link-btn">Contact</a>
        </div>
        <div style="width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding-right: 30px;">
            <a href="login page.html" style="color: white; text-decoration: none; font-size: 18px; background-color: orangered; padding: 8px 15px; border-radius: 5px;transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">Login / Register</a>
            
            <a href="cart page.html" style="position: relative; text-decoration: none;">
                <img src="./Images/cartbl.png" style="height: 30px; background: orangered; padding: 5px; border-radius: 5px;"transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                <span id="cart-count" style="position: absolute; top: -5px; right: -5px; background: white; color: red; border-radius: 50%; padding: 2px 6px; font-size: 12px; font-weight: bold;"></span>
            </a>
        </div>
    </div>

    <div style="margin-top: 150px; text-align: center; padding: 20px;">
        <h1 id="welcome-message" style="color: rgb(121, 14, 14); font-size: 48px; margin-bottom: 10px;">Welcome to Fashion World!</h1>
        <p style="font-size: 20px; color: #333; max-width: 600px; margin: 0 auto 30px auto;">Discover the latest trends in men's, women's, and kids' fashion. High quality, premium styles, and affordable prices.</p>
    </div>

    <h2 style="text-align: center; color: #79150e; margin-top: 20px; font-size: 32px;">Featured Collections</h2>
    <div id="featured-products-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; margin-bottom: 50px;">
        </div>

    <div style="text-align: center; margin-bottom: 50px;">
        <a href="productspage.html" style="background-color: orangered; color: white; text-decoration: none; padding: 15px 40px; font-size: 20px; border-radius: 5px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">View All Products</a>
    </div>

    <script>
        // 1. Check Login Status
        const loggedInUser = localStorage.getItem('vkUser');
        if (loggedInUser) {
            document.getElementById('welcome-message').innerText = `Welcome back, ${loggedInUser}!`;
        }

        // 2. Product Database
        const products = [
            { id: 1, name: "Casual Men's Shirt", price: 1200, image: "./Images/casualmens.jpg" },
            { id: 2, name: "Summer Floral Dress", price: 2500, image: "./Images/floral.webp" },
            { id: 3, name: "Classic Denim Jacket", price: 3000, image: "./Images/denim.webp" },
            { id: 4, name: "Designer Handbag", price: 1800, image: "./Images/hand.jpg" }
        ];

        let cart = JSON.parse(localStorage.getItem('vkCart')) || [];

        // 3. Display Featured Products
        function displayFeaturedProducts() {
            const container = document.getElementById('featured-products-container');
            
            // We only show the first 4 products on the homepage
            const featured = products.slice(0, 4); 

            container.innerHTML = featured.map(product => `
                <div style="background: white; border: 1px solid #ddd; border-radius: 8px; width: 250px; padding: 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s;">
                    <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px;">
                    <h3 style="font-size: 18px; margin: 10px 0; color: #333;">${product.name}</h3>
                    <p style="color: #79150e; font-weight: bold; font-size: 18px;">₹${product.price}</p>
                    <button onclick="addToCart(${product.id})" style="background: rgb(121, 14, 14); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px;">Add to Cart</button>
                </div>
            `).join('');
        }

        // 4. Cart Logic
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            localStorage.setItem('vkCart', JSON.stringify(cart));
            updateCartCounter();
            alert(`${product.name} added to cart!`);
        }

        function updateCartCounter() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        // Run on page load
        displayFeaturedProducts();
        updateCartCounter();
    </script>
</body>
</html>
