<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VkFashions | Cart</title>
    <style>
        .nav-link-btn {
            font-size: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 30px;
            position:relative;
            z-index: 1;
            transition: all 0.3s ease-in-out;
        }

        .nav-link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-color: orangered;
            border-radius: 30px;
            z-index: -1; 
            transform: scaleX(0); 
            transform-origin: center;
            transition: transform 0.3s ease-in-out;
        }

        .nav-link-btn:hover {
            color: white;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5); 
        }

        .nav-link-btn:hover::before {
            transform: scaleX(1); 
        }

        .nav-link-btn.active {
            background-color: orangered;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5);
        }
    </style>
</head>
<body style="background-image: url(./Images/cream123.jpg); background-attachment: fixed; margin: 0; font-family: sans-serif;">
    
    <div style="height: 100px; width: 100%; background-color: rgb(121, 14, 14); position: fixed; top: 0; z-index: 1000; display: flex; align-items: center;">
        <div style="width: 20%; padding-left: 20px;">
            <h2 style="font-size: 32px; color: whitesmoke; font-style: italic; margin: 0;">StyleKart</h2>
        </div>
        <div style="width: 60%; display: flex; justify-content: center; gap: 20px;">
            <a href="ecacrt.html" class="nav-link-btn">Home</a>
            <a href="productspage.html" class="nav-link-btn">Products</a>
        </div>
    </div>

    <div style="margin-top: 120px; padding: 20px; text-align: center;">
        <h2 style="color: #79150e; font-size: 30px;">Your Shopping Cart</h2>
        
        <div id="cart-container" style="max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            </div>

        <div id="cart-summary" style="max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: right; display: none;">
            <h3 id="total-price" style="color: #79150e; font-size: 24px;">Total: ₹0</h3>
            <button onclick="checkout()" style="background: rgb(121, 14, 14); color: white; border: none; padding: 10px 30px; font-size: 18px; border-radius: 5px; cursor: pointer;">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        // Retrieve cart from LocalStorage
        let cart = JSON.parse(localStorage.getItem('vkCart')) || [];

        function displayCart() {
            const container = document.getElementById('cart-container');
            const summary = document.getElementById('cart-summary');
            const totalText = document.getElementById('total-price');
            
            if (cart.length === 0) {
                container.innerHTML = "<h3>Your cart is empty. Go add some fashion!</h3>";
                summary.style.display = 'none';
                return;
            }

            let totalAmount = 0;
            summary.style.display = 'block';

            // Generate HTML for each item in the cart
            container.innerHTML = cart.map((item, index) => {
                totalAmount += item.price;
                return `
                    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 10px 0;">
                        <img src="${item.image}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 5px;">
                        <h4 style="flex: 1; margin-left: 20px; text-align: left;">${item.name}</h4>
                        <p style="font-weight: bold; width: 100px;">₹${item.price}</p>
                        <button onclick="removeItem(${index})" style="background: orangered; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer;">Remove</button>
                    </div>
                `;
            }).join('');

            totalText.innerText = `Total: ₹${totalAmount}`;
        }

        function removeItem(index) {
            // Remove the item at the specific index
            cart.splice(index, 1);
            // Save updated cart back to LocalStorage
            localStorage.setItem('vkCart', JSON.stringify(cart));
            // Re-render the page
            displayCart();
        }

        function checkout() {
            alert("Order placed successfully! Thank you for shopping at StyleKart.");
            localStorage.removeItem('vkCart'); // Clear the cart
            window.location.href = "ecacrt.html"; // Redirect to home
        }

        // Run on page load
        displayCart();
    </script>
</body>
</html>
