<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VkFashions | Products</title>
    <style>
        .nav-link-btn {
            font-size: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 30px;
            position:relative;
            z-index: 1;
            transition: all 0.3s ease-in-out;
        }

        .nav-link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-color: orangered;
            border-radius: 30px;
            z-index: -1; 
            transform: scaleX(0); 
            transform-origin: center;
            transition: transform 0.3s ease-in-out;
        }

        .nav-link-btn:hover {
            color: white;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5); 
        }

        .nav-link-btn:hover::before {
            transform: scaleX(1); 
        }

        .nav-link-btn.active {
            background-color: orangered;
            box-shadow: 0px 4px 10px rgba(255, 69, 0, 0.5);
        }
    </style>
</head>
<body style="background-image: url(./Images/cream123.jpg); background-attachment: fixed; margin: 0; font-family: sans-serif;">
    
    <div style="height: 100px; width: 100%; background-color: rgb(121, 14, 14); position: fixed; top: 0; z-index: 1000; display: flex; align-items: center;">
        <div style="width: 20%; padding-left: 20px;">
            <h2 style="font-size: 32px; color: whitesmoke; font-style: italic; margin: 0;">StyleKart</h2>
        </div>
        <div style="width: 60%; display: flex; justify-content: center; gap: 20px;">
            <a href="ecacrt.html" class="nav-link-btn">Home</a>
            <a href="productspage.html" class="nav-link-btn">Products</a>
            <a href="cart page.html" class="nav-link-btn">Go to Cart</a>
        </div>
    </div>

    <div style="margin-top: 120px; text-align: center;">
        <h2 style="color: #79150e;">All Fashion Products</h2>
        
        <input type="text" id="search-bar" onkeyup="filterProducts()" placeholder="Search for shirts, dresses..." style="padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;">
    </div>

    <div id="product-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px;">
        </div>

    <script>
        // Our Database of Products
        const products = [
            { id: 1, name: "Casual Men's Shirt", price: 1200, image: "./Images/casualmens.jpg" },
            { id: 2, name: "Summer Floral Dress", price: 2500, image: "./Images/floral.webp" },
            { id: 3, name: "Classic Denim Jacket", price: 3000, image: "./Images/denim.webp" },
            { id: 4, name: "Designer Handbag", price: 1800, image: "./Images/hand.jpg" },
            { id: 5, name: "Formal Men's Trousers", price: 1500, image: "./Images/mensfas.webp" },
            { id: 6, name: "Kids Party Wear", price: 1000, image: "./Images/kidsfas.jpg" }
        ];

        let cart = JSON.parse(localStorage.getItem('vkCart')) || [];

        function displayProducts(itemsToDisplay) {
            const container = document.getElementById('product-container');
            if (itemsToDisplay.length === 0) {
                container.innerHTML = "<h3>No products found matching your search.</h3>";
                return;
            }

            container.innerHTML = itemsToDisplay.map(product => `
                <div style="background: white; border: 1px solid #ddd; border-radius: 8px; width: 250px; padding: 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                    <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px;">
                    <h3 style="font-size: 18px; margin: 10px 0;">${product.name}</h3>
                    <p style="color: #79150e; font-weight: bold;">₹${product.price}</p>
                    <button onclick="addToCart(${product.id})" style="background: orangered; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%;">Add to Cart</button>
                </div>
            `).join('');
        }

        function filterProducts() {
            const searchValue = document.getElementById('search-bar').value.toLowerCase();
            const filtered = products.filter(product => product.name.toLowerCase().includes(searchValue));
            displayProducts(filtered);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            localStorage.setItem('vkCart', JSON.stringify(cart));
            alert(`${product.name} added to cart!`);
        }

        // Run on page load
        displayProducts(products);
    </script>
</body>
</html>
